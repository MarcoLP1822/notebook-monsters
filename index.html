<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notebook Monsters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Gochi+Hand&display=swap">
<style>
/* Layout: one landscape exercise-book sheet (1600x1000 logical units) scaled to fit the screen; caption row underneath. */
:root{
  --desk:#c8d1d7; --desk-ink:#26323b; --desk-ink-soft:#52606a; --chip:#f7f9fa; --chip-ink:#26398f; --focus:#2b46c8;
  /* the sheet is a physical object: same colors in both themes */
  --paper:#fdfdfb; --pen:#26398f; --ink:#1d1b22; --bubble:#ffffff;
  --hand:'Gochi Hand','Chalkboard SE','Comic Sans MS',cursive;
  --pen-font:'Caveat','Bradley Hand','Segoe Print',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --desk:#141820; --desk-ink:#dde3ea; --desk-ink-soft:#9aa6b2; --chip:#232a36; --chip-ink:#c4d0ff; --focus:#8ea4ff; color-scheme:dark }
}
:root[data-theme="dark"]{ --desk:#141820; --desk-ink:#dde3ea; --desk-ink-soft:#9aa6b2; --chip:#232a36; --chip-ink:#c4d0ff; --focus:#8ea4ff; color-scheme:dark }

html{height:100%;box-sizing:border-box}
body{
  height:100%;box-sizing:border-box;margin:0;overflow:hidden;
  background:var(--desk);color:var(--desk-ink);font-family:var(--pen-font);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:calc(max(16px, env(safe-area-inset-left, 0px)) + 132px);
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;
}
#wrap{position:relative;flex:none;max-width:100%;width:320px;aspect-ratio:1.6}
#stage{
  position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#stage canvas{position:absolute;left:0;top:0;width:1600px;height:1000px;pointer-events:none}
#cv-paper{z-index:0} #cv-back{z-index:1} #cv-fx{z-index:6}
.writing{position:absolute;z-index:1;color:var(--pen);line-height:1;white-space:nowrap;pointer-events:none}
.title{left:168px;top:88px;font-family:var(--hand);font-size:62px}
.date{right:56px;top:96px;font-family:var(--pen-font);font-weight:700;font-size:50px}

.char{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;outline:none;border-radius:40px}
.char:focus-visible{outline:8px dashed var(--pen);outline-offset:10px}
.char img{position:absolute;inset:0;width:100%;height:100%;max-width:none;pointer-events:none;-webkit-user-drag:none}
#wiz{z-index:2;width:330px;height:365px}
#frank{z-index:3;width:420px;height:288px}
#bat{z-index:4;width:400px;height:268px;transform-origin:50% 48.5%}
#hat{transform-origin:45% 47%}
#wl{transform-origin:29% 50%}
#wr{transform-origin:71% 49%}
.lid{position:absolute;border-radius:50%;transform:scaleY(0);transform-origin:50% 0;box-sizing:border-box}
#wiz .lid{background:#f6d79a;border-bottom:4px solid var(--ink)}
#frank .lid{background:#c9d87e;border-bottom:7px solid var(--ink)}
.l-w1{left:31.8%;top:53.2%;width:5.6%;height:7%}
.l-w2{left:50%;top:53.6%;width:5.1%;height:6.6%}
.l-f1{left:35%;top:31%;width:10.6%;height:18.5%}
.l-f2{left:53.6%;top:30.5%;width:9.4%;height:15%}

#bubbles{position:absolute;inset:0;z-index:7;pointer-events:none}
.bubble{
  position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%;
  background:var(--bubble);color:var(--ink);font-family:var(--hand);font-size:46px;line-height:1;
  padding:14px 28px 16px;border:5px solid var(--ink);white-space:nowrap;
  border-radius:48% 52% 46% 54% / 58% 54% 46% 42%;
  animation:pop 1.5s both;
}
.bubble::after{
  content:"";position:absolute;left:46%;bottom:-17px;width:24px;height:24px;background:var(--bubble);
  border-right:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:rotate(40deg) skew(10deg,10deg);
}
@keyframes pop{
  0%{transform:translate(-50%,-100%) scale(.2);opacity:0}
  12%{transform:translate(-50%,-100%) scale(1.12);opacity:1}
  20%{transform:translate(-50%,-100%) scale(1)}
  80%{transform:translate(-50%,-104%) scale(1);opacity:1}
  100%{transform:translate(-50%,-112%) scale(1);opacity:0}
}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;max-width:100%;width:320px}
.hint{margin:0;font-size:22px;line-height:1.15;color:var(--desk-ink);min-width:0;text-wrap:balance}
.hint b{font-weight:700}
#snd{
  font:700 20px/1 var(--pen-font);color:var(--chip-ink);background:var(--chip);
  border:2px solid currentColor;border-radius:14px 18px 12px 20px;padding:6px 14px 7px;cursor:pointer;
}
#snd:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#snd[aria-pressed="false"]{color:var(--desk-ink-soft);border-style:dashed}
.scenes{
  position:fixed;left:max(12px, env(safe-area-inset-left, 0px));top:50%;transform:translateY(-50%);width:120px;
  display:flex;flex-direction:column;gap:6px;
}
.scenes h2{margin:0 0 2px;font:700 22px/1 var(--pen-font);color:var(--desk-ink)}
.scenes button{
  font:700 20px/1 var(--pen-font);color:var(--chip-ink);background:var(--chip);text-align:left;
  border:2px solid currentColor;border-radius:14px 18px 12px 20px;padding:6px 12px 7px;cursor:pointer;
}
.scenes button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.scenes button.queued{border-style:dashed}
.scenes button.playing{background:var(--chip-ink);color:var(--chip)}
.scenes #auto{margin-top:6px}
.scenes #auto[aria-pressed="false"]{color:var(--desk-ink-soft);border-style:dashed}
@media (max-height:520px){ body{gap:6px;padding-block:8px} .hint{font-size:17px} #snd{font-size:16px;padding:4px 10px 5px} }
</style>

<script>
(() => {
const LW = 1600, LH = 1000, GROUND = 900;
const INK = '#1d1b22', GOLD = '#ffd23f', VIOLET = '#8a6ff0', PAPER = '#fdfdfb';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const stage = $('stage'), wrap = $('wrap'), bar = $('bar'), bubbles = $('bubbles');
const cvP = $('cv-paper'), cvB = $('cv-back'), cvF = $('cv-fx');
const ctxB = cvB.getContext('2d'), ctxF = cvF.getContext('2d');
let S = 1, DPR = 1;

/* ---------- clock & tweens (paused with the tab) ---------- */
let T = 0;
const tasks = new Set();
const E = {
  lin: k => k,
  io: k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  back: k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  elastic: k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * 2.094) + 1,
};
function tween(d, fn, ease = E.io) {
  return new Promise(res => {
    const t0 = T;
    const task = () => {
      const k = Math.min(1, (T - t0) / d);
      fn(ease(k), k);
      if (k >= 1) { tasks.delete(task); res(); }
    };
    tasks.add(task); task();
  });
}
const wait = d => tween(d, () => {});
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- characters ---------- */
function mk(id, o) {
  return Object.assign({ el: $(id), dx: 0, dy: 0, rot: 0, sx: 1, sy: 1, sc: 1, busy: false }, o);
}
const wiz = mk('wiz', { x: 400, y: GROUND, w: 330, h: 365, ox: .5, oy: 1, hatRot: 0, hatDy: 0, hatNow: 0 });
const frank = mk('frank', { x: 1180, y: GROUND, w: 420, h: 288, ox: .5, oy: 1, hue: 0 });
const bat = mk('bat', { x: 800, y: 300, w: 400, h: 268, ox: .5, oy: .485, vx: 0, vy: 0, tx: 800, ty: 300,
  k: 7, spin: 0, flap: 0, flapRate: 3.2, free: true, perch: false, zapped: false });
const hat = $('hat'), wl = $('wl'), wr = $('wr');

function place(c, extraRot, esx, esy) {
  const tx = c.x + c.dx - c.w * c.ox, ty = c.y + c.dy - c.h * c.oy;
  c.m = { tx, ty, rot: c.rot + extraRot, sx: c.sx * c.sc * esx, sy: c.sy * c.sc * esy };
  c.el.style.transform = `translate(${tx}px,${ty}px) rotate(${c.m.rot}deg) scale(${c.m.sx},${c.m.sy})`;
}
// point given as fractions of a character's box -> stage coords (optionally through a rotated part)
function toWorld(c, fx, fy, part) {
  let px = fx * c.w, py = fy * c.h;
  if (part) {
    const a = part.rot * Math.PI / 180, cx = part.px * c.w, cy = part.py * c.h, X = px - cx, Y = py - cy;
    px = cx + X * Math.cos(a) - Y * Math.sin(a);
    py = cy + X * Math.sin(a) + Y * Math.cos(a) + (part.dy || 0);
  }
  const m = c.m, ox = c.ox * c.w, oy = c.oy * c.h, a = m.rot * Math.PI / 180;
  const X = (px - ox) * m.sx, Y = (py - oy) * m.sy;
  return { x: m.tx + ox + X * Math.cos(a) - Y * Math.sin(a), y: m.ty + oy + X * Math.sin(a) + Y * Math.cos(a) };
}
const hatPart = () => ({ px: .45, py: .47, rot: wiz.hatNow, dy: wiz.hatDy });
const hatTip = () => toWorld(wiz, .40, .035, hatPart());
const perchPoint = () => { const p = hatTip(); return { x: p.x + 4, y: p.y - bat.h * .42 * bat.sc }; };

/* ---------- sound (synthesised; silent until the first tap) ---------- */
let AC = null, soundOn = true;
try { soundOn = localStorage.getItem('nm-sound') !== 'off'; } catch (e) {}
function audio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { AC = new C(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
const live = () => soundOn && AC && AC.state === 'running';
function tone(type, f0, f1, dur, vol = .12, delay = 0) {
  if (!live()) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + .05);
}
function hiss(dur, vol, freq) {
  if (!live()) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(200, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}
const sfx = {
  hop: () => tone('sine', 240, 520, .13, .1),
  squeak: () => { tone('sine', 1500, 2500, .07, .06); tone('sine', 1700, 2700, .06, .05, .09); },
  poof: () => hiss(.4, .22, 2200),
  magic: () => [0, 4, 7, 12, 16].forEach((s, i) => tone('triangle', 660 * 2 ** (s / 12), 670 * 2 ** (s / 12), .2, .07, i * .07)),
  zap: () => { for (let i = 0; i < 9; i++) tone('sawtooth', rand(70, 160), rand(90, 420), .09, .05, i * .085); hiss(.8, .06, 5000); },
  boing: () => { tone('sine', 140, 460, .28, .13); tone('sine', 150, 120, .3, .06, .2); },
  note: f => tone('triangle', f, f * 1.002, .26, .09),
};

/* ---------- effects (canvas particles) ---------- */
const parts = [];
const addP = p => { p.t0 = T; parts.push(p); return p; };
function starPath(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * .46 : r, a = rot + i * Math.PI / 5 - Math.PI / 2;
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath();
}
function star(c, x, y, r, rot, fill) {
  starPath(c, x, y, r, rot);
  c.lineJoin = 'round'; c.lineWidth = Math.max(2, r * .24); c.strokeStyle = INK; c.stroke();
  c.fillStyle = fill; c.fill();
}
function sparkle(x, y, spread = 40) {
  const vx = rand(-spread, spread), vy = rand(-spread, spread * .5), rot = rand(0, 6), col = Math.random() < .6 ? GOLD : VIOLET, r0 = rand(7, 12);
  addP({ life: rand(.4, .8), draw(c, k, t) { star(c, x + vx * t, y + vy * t + 70 * t * t, r0 * (1 - k) + 2, rot + t * 5, col); } });
}
function burst(x, y, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, sp = rand(140, 260), rot = rand(0, 6), col = i % 2 ? GOLD : VIOLET;
    addP({ life: .55, draw(c, k, t) { star(c, x + Math.cos(a) * sp * t, y + Math.sin(a) * sp * t, 13 * (1 - k) + 3, rot + t * 6, col); } });
  }
}
function poof(x, y, s = 1) {
  sfx.poof();
  const blobs = Array.from({ length: 9 }, (_, i) => ({ a: i / 9 * Math.PI * 2 + rand(-.25, .25), d: rand(.55, 1), r: rand(.5, .85) }));
  addP({ life: .65, draw(c, k) {
    const R = lerp(18, 95, E.out(k)) * s;
    c.globalAlpha = k < .55 ? 1 : 1 - (k - .55) / .45;
    for (const pass of [0, 1]) for (const b of blobs) {
      c.beginPath(); c.arc(x + Math.cos(b.a) * b.d * R, y + Math.sin(b.a) * b.d * R * .78, b.r * R * (1 - .25 * k), 0, 7);
      if (pass === 0) { c.lineWidth = 8; c.strokeStyle = INK; c.stroke(); } else { c.fillStyle = '#ffffff'; c.fill(); }
    }
    c.globalAlpha = 1;
  } });

}
function smoke(x, y) {
  const vx = rand(-25, 25), r0 = rand(16, 26);
  addP({ life: .9, draw(c, k, t) {
    c.globalAlpha = 1 - k;
    c.beginPath(); c.arc(x + vx * t, y - 60 * t, r0 * (1 + k), 0, 7);
    c.fillStyle = '#9aa1ab'; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
    c.globalAlpha = 1;
  } });
}
function lightning(fromFn, toFn, life) {
  let offs = [], next = 0;
  addP({ life, draw(c, k, t) {
    if (t >= next) { offs = Array.from({ length: 8 }, () => rand(-.16, .16)); next = t + .06; }
    const a = fromFn(), b = toFn(), dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
    c.beginPath(); c.moveTo(a.x, a.y);
    offs.forEach((o, i) => { const q = (i + 1) / (offs.length + 1); c.lineTo(a.x + dx * q + nx * o * len, a.y + dy * q + ny * o * len); });

    c.strokeStyle = GOLD; c.lineWidth = 7; c.stroke();

}
function note(x, y) {
  const vx = rand(-30, 30), ph = rand(0, 6), two = Math.random() < .4;
  addP({ life: 1.6, draw(c, k, t) {
    const px = x + vx * t + Math.sin(t * 5 + ph) * 12, py = y - t * 95;

    c.fillStyle = INK; c.strokeStyle = INK; c.lineWidth = 6; c.lineCap = 'round';

    head(px);

    if (two) { head(px + 40); c.moveTo(px + 52, py - 3); c.lineTo(px + 52, py - 56); c.moveTo(px + 12, py - 52); c.lineTo(px + 52, py - 56); }

}
function mark(x, y) {

function spell(p0, toFn, d) {

    const p2 = toFn(), cx = (p0.x + p2.x) / 2, cy = Math.min(p0.y, p2.y) - 240, u = 1 - k;
    head.x = u * u * p0.x + 2 * u * k * cx + k * k * p2.x;
    head.y = u * u * p0.y + 2 * u * k * cy + k * k * p2.y;

async function hop(c, hgt = 60, d = .45) {
  await tween(.1, k => { c.sy = 1 - .12 * k; c.sx = 1 + .08 * k; });
  sfx.hop();
  await tween(d, k => { const s = Math.sin(k * Math.PI); c.dy = -hgt * s; c.sy = lerp(.88, 1, Math.min(1, k * 4)) + .06 * s; c.sx = lerp(1.08, 1, Math.min(1, k * 4)) - .04 * s; }, E.lin);
  await tween(.15, k => { const s = Math.sin(k * Math.PI); c.dy = 0; c.sy = 1 - .1 * s; c.sx = 1 + .07 * s; });
  c.sx = c.sy = 1; c.dy = 0;
}
async function cast(toFn) {

/* ---------- taps ---------- */
async function frankTap() {
  say(frank, 'BZZT!', .5, 0); sfx.zap(); hop(frank, 55, .4);
  for (let i = 0; i < 4; i++) {
    for (const [fx, sgn] of [[.03, -1], [.975, 1]]) {
      const off = { x: sgn * rand(60, 140), y: rand(-90, 90) };
      lightning(() => toWorld(frank, fx, .47), () => { const a = toWorld(frank, fx, .47); return { x: a.x + off.x, y: a.y + off.y }; }, .18);
    }

  }

}
async function batTap() {
  bat.free = false; bat.k = 60; say(bat, 'wheee!', .5, 0); sfx.squeak();
  const cx = bat.x, cy = clamp(bat.y, 300, 760);
  await tween(1.1, k => { const a = k * Math.PI * 2; bat.tx = cx + Math.sin(a) * 140; bat.ty = cy - 140 + Math.cos(a) * 140; bat.spin = -360 * k; }, E.io);
  bat.spin = 0; bat.k = 7; bat.free = true;
}
async function callBat(x, y) {
  mark(x, y); bat.free = false; bat.k = 10;
  bat.tx = clamp(x, 200, 1400); bat.ty = clamp(y, 170, 720); sfx.squeak();
  await wait(1.8); bat.k = 7; bat.free = true;

async function run(cs, fn) {
  if (cs.some(c => c.busy)) return false;
  cs.forEach(c => c.busy = true);
  try { await fn(); } finally { cs.forEach(c => c.busy = false); }
  return true;
}
function poke(id) {
  if (id === 'frank') run([frank], frankTap);
  else if (id === 'bat') run([bat], batTap);
  else if (id === 'wiz') {
    const first = Math.random() < .5 ? frank : bat, other = first === frank ? bat : frank;
    const t = !first.busy ? first : !other.busy ? other : null;
    if (t) run([wiz, t], t === frank ? ep.grow : ep.tiny);
  }
}
stage.addEventListener('pointerdown', e => {

  const x = (e.clientX - r.left) / r.width * LW, y = (e.clientY - r.top) / r.height * LH;
  if (bat.busy) mark(x, y); else run([bat], () => callBat(x, y));

  c.fillStyle = PAPER; c.beginPath(); c.roundRect ? c.roundRect(6, 26, LW - 12, LH - 34, 10) : c.rect(6, 26, LW - 12, LH - 34); c.fill();
  c.restore();
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  c.fillStyle = 'rgba(110,115,140,.06)';
  for (let i = 0; i < 4500; i++) c.fillRect(6 + rnd() * (LW - 12), 26 + rnd() * (LH - 34), 1.6, 1.6);
  c.strokeStyle = '#a9c7e7'; c.lineWidth = 2;
  for (let y = 150; y <= 950; y += 50) { c.beginPath(); c.moveTo(6, y); c.lineTo(LW - 6, y); c.stroke(); }
  c.strokeStyle = '#e1838c'; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(132, 26); c.lineTo(132, LH - 8); c.stroke();
  c.save(); c.globalCompositeOperation = 'destination-out';
  for (let x = 58; x < LW - 30; x += 56) { c.beginPath(); c.ellipse(x, 64, 11, 13, 0, 0, 7); c.fill(); }
  c.restore();
  for (let x = 58; x < LW - 30; x += 56) {

    c.lineCap = 'round';
    coil(); c.strokeStyle = '#3f464e'; c.lineWidth = 10; c.stroke();
    coil(); c.strokeStyle = '#aab3bc'; c.lineWidth = 5.5; c.stroke();

}
function fit() {
  const cs = getComputedStyle(document.body);
  const aw = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  let w = aw;
  for (let pass = 0; pass < 2; pass++) {
    bar.style.width = w + 'px';
    const extra = bar.offsetHeight + 10;
    const ah = document.body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - extra;
    w = Math.max(160, Math.min(aw, ah * 1.6));
  }
  bar.style.width = w + 'px';
  wrap.style.width = w + 'px'; wrap.style.height = w / 1.6 + 'px';
  S = w / LW; stage.style.transform = `scale(${S})`;
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  for (const cv of [cvP, cvB, cvF]) {
    cv.width = Math.round(LW * S * DPR); cv.height = Math.round(LH * S * DPR);
    cv.getContext('2d').setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  }
  drawPaper();
}

function shadow(x, rx, lift, alpha) {
  const s = Math.max(.3, 1 - lift / 900);
  ctxB.globalAlpha = alpha * s;
  ctxB.beginPath(); ctxB.ellipse(x, GROUND + 6, rx * s, 15 * s, 0, 0, 7); ctxB.fill();
}
function updateBat(dt, amp) {
  if (bat.perch) {
    const p = perchPoint(); bat.x = p.x; bat.y = p.y; bat.vx = bat.vy = 0;
  } else {
    if (bat.free) { bat.tx = 800 + 250 * Math.sin(T * .45); bat.ty = 300 + 55 * Math.sin(T * .9); }
    const k = bat.k, c = 2 * Math.sqrt(k);
    bat.vx += ((bat.tx - bat.x) * k - bat.vx * c) * dt;
    bat.vy += ((bat.ty - bat.y) * k - bat.vy * c) * dt;
    bat.x += bat.vx * dt; bat.y += bat.vy * dt;
  }
  bat.flap += dt * (bat.perch ? 1.2 : bat.flapRate) * Math.PI * 2;
  const w = Math.sin(bat.flap), base = bat.perch ? -16 : 0, A = bat.perch ? 5 : 24;
  wl.style.transform = `rotate(${base + A * w}deg)`;
  wr.style.transform = `rotate(${-(base + A * w)}deg)`;
  bat.dy = bat.perch ? 0 : -7 * amp * Math.cos(bat.flap);
  const lean = bat.perch ? (wiz.hatNow + wiz.rot) * .8 : clamp(bat.vx * .03, -26, 26);
  place(bat, lean + bat.spin, 1, 1);
  bat.el.style.filter = bat.zapped && Math.floor(T * 14) % 2 ? 'invert(1)' : '';
  wiz.el.style.filter = wiz.zapped && Math.floor(T * 14) % 2 ? 'invert(1)' : '';
}
let last = 0;
function frame(ts) {
  const now = ts / 1000, dt = last ? Math.min(.05, now - last) : .016;
  last = now; T += dt;
  for (const t of [...tasks]) t();
  const amp = RM ? .5 : 1;
  const br = Math.sin(T * 2.2) * amp;
  place(wiz, 0, 1 - .012 * br, 1 + .018 * br);
  wiz.hatNow = wiz.hatRot + 2.5 * amp * Math.sin(T * 1.6 + 1);
  hat.style.transform = `translateY(${wiz.hatDy}px) rotate(${wiz.hatNow}deg)`;
  const fr = Math.sin(T * 1.9 + 2) * amp;
  place(frank, 1.6 * amp * Math.sin(T * 1.25), 1 - .01 * fr, 1 + .015 * fr);
  frank.el.style.filter = frank.hue ? `hue-rotate(${frank.hue}deg) saturate(1.25)` : '';
  updateBat(dt, amp);

  ctxB.clearRect(0, 0, LW, LH); ctxB.fillStyle = '#262c48';
  shadow(wiz.x + wiz.dx, wiz.w * .36 * wiz.sc, -wiz.dy, .14);
  shadow(frank.x + frank.dx, frank.w * .4 * frank.sc, -frank.dy, .14);
  shadow(bat.x, 120 * bat.sc, GROUND - bat.y, .1);
  ctxB.globalAlpha = 1;

  ctxF.clearRect(0, 0, LW, LH);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], age = T - p.t0, k = age / p.life;
    if (k >= 1) { parts.splice(i--, 1); continue; }
    p.draw(ctxF, k, age);
  }
  requestAnimationFrame(frame);
}

/* ---------- blinking ---------- */
function blinker(c, sel) {
  const lids = [...c.el.querySelectorAll(sel)];
  (async () => {
    for (;;) {
      await wait(rand(1.8, 4.5));
      await tween(.07, k => lids.forEach(l => l.style.transform = `scaleY(${k})`));
      await wait(.05);
      await tween(.09, k => lids.forEach(l => l.style.transform = `scaleY(${1 - k})`));
    }
  })();
}

/* ---------- director: plays the scenes in turn, then shuffles ---------- */
const order = ['zap', 'grow', 'perch', 'tiny', 'dance'];
const castOf = { zap: [bat, frank, wiz], grow: [wiz, frank], perch: [bat, wiz], tiny: [wiz, bat], dance: [wiz, frank, bat] };
let queued = null, auto = true;
const sceneBtn = {};
for (const name of order) {
  const b = sceneBtn[name] = document.createElement('button');
  b.type = 'button'; b.textContent = name[0].toUpperCase() + name.slice(1);
  b.addEventListener('click', () => { audio(); if (queued) sceneBtn[queued].classList.remove('queued'); queued = name; b.classList.add('queued'); });
  $('auto').before(b);
}
const autoBtn = $('auto');
autoBtn.addEventListener('click', () => { auto = !auto; autoBtn.textContent = auto ? 'Auto on' : 'Auto off'; autoBtn.setAttribute('aria-pressed', String(auto)); });
async function director() {
  let i = 0, prev = null;
  await wait(1.4);
  for (;;) {
    // a clicked scene goes first; otherwise (in auto) the intro order, then a shuffle
    const name = queued || (auto ? (i < order.length ? order[i] : pick(order.filter(n => n !== prev))) : null);
    if (!name || castOf[name].some(c => c.busy)) { await wait(.2); continue; }
    if (name === queued) { queued = null; sceneBtn[name].classList.remove('queued'); } else i++;
    prev = name;
    sceneBtn[name].classList.add('playing');
    await run(castOf[name], ep[name]);
    sceneBtn[name].classList.remove('playing');
    const until = T + (RM ? rand(6, 9) : rand(1.8, 3.2));
    while (T < until && !queued) await wait(.1);
  }
}

fit();
// first still frame: everyone in place before the loop starts
place(wiz, 0, 1, 1); place(frank, 0, 1, 1); place(bat, 0, 1, 1);
requestAnimationFrame(frame);
blinker(wiz, '.lid'); blinker(frank, '.lid');
director();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
